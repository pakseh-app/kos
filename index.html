<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Kos Neon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        /* =========================================
           TEMA NEON GLOW (CSS MURNI)
           ========================================= */
        :root {
            --bg-dark: #090a0f;
            --panel-bg: #13151f;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-yellow: #fffb00;
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        body {
            margin: 0; padding: 0; padding-bottom: 80px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* HEADER */
        .header {
            background: var(--panel-bg);
            padding: 15px 20px;
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 50;
        }
        .header h1 {
            margin: 0; font-size: 22px; font-weight: 800;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* BUTTONS (TOMBOL NEON) */
        .btn-neon {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 16px; border-radius: 8px;
            font-weight: bold; cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.4) inset, 0 0 8px rgba(0, 243, 255, 0.4);
            transition: all 0.2s;
            text-transform: uppercase; font-size: 12px; letter-spacing: 1px;
        }
        .btn-neon:active {
            background: var(--neon-blue); color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }
        
        .btn-neon.pink {
            border-color: var(--neon-pink); color: var(--neon-pink);
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.4) inset, 0 0 8px rgba(255, 0, 255, 0.4);
        }
        .btn-neon.pink:active { background: var(--neon-pink); color: #000; box-shadow: 0 0 20px var(--neon-pink); }
        
        .btn-neon.green {
            border-color: var(--neon-green); color: var(--neon-green);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.4) inset, 0 0 8px rgba(57, 255, 20, 0.4);
        }
        .btn-neon.green:active { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        .btn-icon {
            background: transparent; border: 2px solid var(--neon-yellow); color: var(--neon-yellow);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px rgba(255, 251, 0, 0.4) inset, 0 0 10px rgba(255, 251, 0, 0.4);
            font-size: 18px; cursor: pointer; transition: 0.3s;
        }

        /* CONTAINER & TABS */
        .container { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: neonFade 0.4s ease-in-out; }
        @keyframes neonFade { 
            0% { opacity: 0; filter: brightness(0); transform: translateY(10px); } 
            100% { opacity: 1; filter: brightness(1); transform: translateY(0); } 
        }

        /* CARDS */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
            border-radius: 12px; padding: 20px; margin-bottom: 20px;
        }
        .card-title { color: var(--neon-pink); margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; text-shadow: 0 0 5px var(--neon-pink); }
        .uang-besar { font-size: 38px; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); margin: 10px 0; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .flex-gap { display: flex; gap: 15px; margin-bottom: 20px; }
        .w-full { width: 100%; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { border-bottom: 2px solid var(--neon-blue); padding: 12px; text-align: left; color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }
        td { padding: 12px; border-bottom: 1px solid #222; }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--panel-bg);
            border-top: 2px solid var(--neon-blue);
            box-shadow: 0 -5px 20px rgba(0, 243, 255, 0.2);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 50;
        }
        .nav-btn {
            background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s;
        }
        .nav-btn i { font-size: 24px; margin-bottom: 3px; transition: 0.3s; }
        .nav-btn.active { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        .nav-btn.active i { transform: translateY(-3px); }

        /* MODALS */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px);
        }
        .modal-box {
            background: var(--panel-bg); border: 2px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5); border-radius: 15px;
            padding: 25px; width: 90%; max-width: 320px; text-align: center;
        }
        .modal-bg.active { display: flex; animation: neonFade 0.3s; }
        
        .input-neon {
            background: #000; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 12px; width: 100%; box-sizing: border-box; border-radius: 8px; margin: 15px 0;
            text-align: center; outline: none; font-size: 16px; font-weight: bold; letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2) inset;
        }
        .input-neon:focus { box-shadow: 0 0 15px var(--neon-blue); }
    </style>
</head>
<body>

    <header class="header">
        <div>
            <h1>Kas Kos</h1>
            <div style="font-size: 10px; color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green);">● SYSTEM ONLINE</div>
        </div>
        <button class="btn-icon" id="btn-lock"><i class="bi bi-lock-fill"></i></button>
    </header>

    <main class="container">
        
        <section id="tab-beranda" class="tab-content active">
            <div class="card">
                <h2 class="card-title">SALDO SAAT INI</h2>
                <div class="uang-besar">Rp 0</div>
                <div style="background: #222; height: 8px; border-radius: 4px; margin: 15px 0; overflow: hidden; border: 1px solid var(--neon-blue);">
                    <div style="width: 0%; height: 100%; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue);"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--neon-blue);">
                    <span>0 Anggota Lunas</span>
                    <span>0%</span>
                </div>
            </div>

            <div class="grid-2">
                <div class="card" style="border-color: var(--neon-green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);">
                    <h2 class="card-title" style="color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green);">PEMASUKAN</h2>
                    <h3 style="color: var(--neon-green); margin: 0; font-size: 20px;">Rp 0</h3>
                </div>
                <div class="card" style="border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 255, 0.1);">
                    <h2 class="card-title">PENGELUARAN</h2>
                    <h3 style="color: var(--neon-pink); margin: 0; font-size: 20px;">Rp 0</h3>
                </div>
            </div>
        </section>

        <section id="tab-anggota" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin:0; color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); text-transform: uppercase;">Daftar Anggota</h2>
                <button class="btn-neon action-btn" data-action="Tambah Anggota"><i class="bi bi-plus-lg"></i> Tambah</button>
            </div>

            <div class="card" style="padding: 10px;">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td><strong style="color: var(--text-main);">Wulan</strong><br><small style="color: var(--neon-pink);">Belum</small></td>
                            <td style="text-align: center;">
                                <button class="btn-neon green action-btn" data-action="Bayar Kas Wulan">BAYAR</button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td><strong style="color: var(--text-main);">Titis</strong><br><small style="color: var(--neon-pink);">Belum</small></td>
                            <td style="text-align: center;">
                                <button class="btn-neon green action-btn" data-action="Bayar Kas Titis">BAYAR</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="tab-transaksi" class="tab-content">
            <h2 style="margin-top:0; color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); text-transform: uppercase;">Riwayat Transaksi</h2>
            
            <div class="flex-gap">
                <button class="btn-neon green w-full action-btn" data-action="Tambah Pemasukan">+ MASUK</button>
                <button class="btn-neon pink w-full action-btn" data-action="Tambah Pengeluaran">- KELUAR</button>
            </div>

            <div class="card" style="text-align: center; color: var(--text-muted); padding: 50px 20px; border-style: dashed;">
                SYSTEM STANDBY.<br>Belum ada data transaksi.
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="tab-beranda">
            <i class="bi bi-cpu"></i> BERANDA
        </button>
        <button class="nav-btn" data-target="tab-anggota">
            <i class="bi bi-people"></i> ANGGOTA
        </button>
        <button class="nav-btn" data-target="tab-transaksi">
            <i class="bi bi-activity"></i> TRANSAKSI
        </button>
    </nav>

    <div class="modal-bg" id="modal-lock">
        <div class="modal-box">
            <i class="bi bi-shield-lock-fill" style="font-size: 40px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue);"></i>
            <h3 style="color: var(--neon-blue); text-transform: uppercase; margin-top: 10px;">Security Check</h3>
            <p style="font-size: 12px; color: var(--text-muted);">Masukkan password admin (kos123)</p>
            <input type="password" id="input-pwd" class="input-neon" placeholder="PASSWORD">
            <div class="flex-gap" style="margin-bottom: 0;">
                <button class="btn-neon pink w-full" id="btn-cancel-lock">BATAL</button>
                <button class="btn-neon green w-full" id="btn-submit-lock">HACK IN</button>
            </div>
        </div>
    </div>

    <div class="modal-bg" id="modal-alert">
        <div class="modal-box" id="alert-box">
            <h3 id="alert-title" style="margin-top: 0; text-transform: uppercase;">PESAN</h3>
            <p id="alert-text" style="font-size: 14px; margin-bottom: 25px;"></p>
            <button class="btn-neon w-full" id="btn-close-alert">OKAY</button>
        </div>
    </div>

    <script>
        // --- 1. STATE & VARIABEL ---
        let isUnlocked = false;

        const tabs = document.querySelectorAll('.tab-content');
        const navBtns = document.querySelectorAll('.nav-btn');
        const actionBtns = document.querySelectorAll('.action-btn');
        
        const btnLock = document.getElementById('btn-lock');
        const modalLock = document.getElementById('modal-lock');
        const modalAlert = document.getElementById('modal-alert');

        // --- 2. FUNGSI NAVIGASI TAB ---
        navBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Matikan semua
                navBtns.forEach(b => b.classList.remove('active'));
                tabs.forEach(t => t.classList.remove('active'));
                
                // Aktifkan yang diklik
                this.classList.add('active');
                const targetId = this.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // --- 3. FUNGSI MODAL ALERT ---
        function showMessage(title, text, isError = false) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-text').innerText = text;
            
            const box = document.getElementById('alert-box');
            if(isError) {
                box.style.borderColor = 'var(--neon-pink)';
                box.style.boxShadow = '0 0 30px rgba(255,0,255,0.5)';
                document.getElementById('alert-title').style.color = 'var(--neon-pink)';
            } else {
                box.style.borderColor = 'var(--neon-green)';
                box.style.boxShadow = '0 0 30px rgba(57,255,20,0.5)';
                document.getElementById('alert-title').style.color = 'var(--neon-green)';
            }
            
            modalAlert.classList.add('active');
        }

        document.getElementById('btn-close-alert').addEventListener('click', function() {
            modalAlert.classList.remove('active');
        });

        // --- 4. FUNGSI GEMBOK (SECURITY) ---
        btnLock.addEventListener('click', function() {
            if (isUnlocked) {
                // Kunci lagi
                isUnlocked = false;
                btnLock.innerHTML = '<i class="bi bi-lock-fill"></i>';
                btnLock.style.borderColor = 'var(--neon-yellow)';
                btnLock.style.color = 'var(--neon-yellow)';
                btnLock.style.boxShadow = '0 0 10px rgba(255,251,0,0.4) inset, 0 0 10px rgba(255,251,0,0.4)';
                showMessage("SYSTEM LOCKED", "Akses edit telah ditutup kembali.", true);
            } else {
                // Minta password
                document.getElementById('input-pwd').value = "";
                modalLock.classList.add('active');
            }
        });

        document.getElementById('btn-cancel-lock').addEventListener('click', function() {
            modalLock.classList.remove('active');
        });

        document.getElementById('btn-submit-lock').addEventListener('click', function() {
            const pwd = document.getElementById('input-pwd').value;
            if (pwd === "kos123") {
                isUnlocked = true;
                modalLock.classList.remove('active');
                
                // Ubah gembok jadi hijau/terbuka
                btnLock.innerHTML = '<i class="bi bi-unlock-fill"></i>';
                btnLock.style.borderColor = 'var(--neon-green)';
                btnLock.style.color = 'var(--neon-green)';
                btnLock.style.boxShadow = '0 0 10px rgba(57,255,20,0.4) inset, 0 0 10px rgba(57,255,20,0.4)';
                
                showMessage("ACCESS GRANTED", "Sistem terbuka. Anda bisa mengedit data sekarang.", false);
            } else {
                showMessage("ACCESS DENIED", "Password salah!", true);
            }
        });

        // --- 5. FUNGSI TOMBOL AKSI (BAYAR, TAMBAH, DLL) ---
        actionBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const jenisAksi = this.getAttribute('data-action');
                if (!isUnlocked) {
                    showMessage("ACCESS DENIED", "Sistem terkunci! Klik ikon gembok di kanan atas dan masukkan password.", true);
                } else {
                    showMessage("SIMULATION SUCCESS", `Perintah [${jenisAksi}] berhasil dijalankan!`, false);
                }
            });
        });
    </script>
</body>
</html>
